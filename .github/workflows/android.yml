# Builds the Play Store app (android/) on GitHub's machines, which have the Android tools installed.
# Download the result from the run's "Artifacts" section. See PLAY_STORE.md.
#
# Signing: add two repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_B64       the upload key (.jks file) as base64 text
#   ANDROID_KEYSTORE_PASSWORD  its password
# Without them a test version (debug APK) is built that can be installed on a phone but not uploaded to Play.
name: Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: building a test APK only (not uploadable to Play)."
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            gradle --no-daemon --stacktrace bundleRelease assembleRelease
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Collect files
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          find android/app/build/outputs -name "*.aab" -exec cp {} out/madarwala-attendance-${{ github.run_number }}.aab \;
          find android/app/build/outputs -name "*.apk" ! -name "*unsigned*" -exec cp {} out/ \;
          ls -la out
          {
            echo "## Madarwala Attendance 1.0.${{ github.run_number }} (version code ${{ github.run_number }})"
            echo
            if [ -n "${KEYSTORE_FILE:-}" ]; then
              echo "Upload **madarwala-attendance-${{ github.run_number }}.aab** to Play Console. The .apk can be installed directly on a phone."
              echo
              echo "Upload key SHA-256 (for ANDROID_CERT_SHA256 on the server):"
              echo '```'
              keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" | grep "SHA256:" | sed 's/.*SHA256: //'
              echo '```'
            else
              echo "Test build only (no signing secrets): install the debug .apk on a phone to try it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: madarwala-attendance-${{ github.run_number }}
          path: out/
          retention-days: 30
