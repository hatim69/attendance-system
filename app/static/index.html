<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Admin</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f4f5f7;color:#1c1e21}
 header{background:#1f2937;color:#fff;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
 header a{color:#cbd5e1;cursor:pointer;padding:4px 10px;border-radius:4px}
 header a.on{background:#374151;color:#fff}
 main{padding:20px;max-width:1150px;margin:auto;overflow-x:auto}
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden}
 th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #eee;vertical-align:middle}
 th{background:#f9fafb;font-size:12px;text-transform:uppercase;color:#6b7280}
 .Present{color:#15803d}.Late{color:#b45309}.Absent{color:#b91c1c}.rejected{text-decoration:line-through;color:#9ca3af}
 .tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#e5e7eb}.tag.warn{background:#fef3c7;color:#92400e}.tag.bad{background:#fee2e2;color:#991b1b}.tag.good{background:#dcfce7;color:#166534}
 .toast{background:#dcfce7;border-left:4px solid #16a34a;padding:10px 14px;margin:6px 0;border-radius:4px}
 input,button{padding:6px 10px;margin:2px;font-size:14px} button{cursor:pointer}
 img.th{width:44px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer}
 .bar{margin-bottom:12px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
 .stat{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px #0001;cursor:pointer;border-left:5px solid var(--c)}
 .stat b{font-size:30px;display:block}.stat span{color:#6b7280;font-size:13px}
 .two{display:grid;grid-template-columns:3fr 2fr;gap:16px}@media(max-width:850px){.two{grid-template-columns:1fr}}
 .panel{background:#fff;border-radius:10px;box-shadow:0 1px 3px #0001;overflow:hidden;margin-bottom:16px}.panel h4{margin:0;padding:10px 14px;color:#fff;background:var(--c,#2563eb)}
 .bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:14px 14px 0;overflow-x:auto}.bars div{flex:0 1 90px;min-width:34px;text-align:center;font-size:11px}
 .bars i{display:block;background:#22c55e;border-radius:3px 3px 0 0;margin:0 auto;width:60%}.bars em{display:block;font-style:normal;height:16px}.bars u{text-decoration:none;display:block;height:30px;overflow:hidden}
 .gp{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid #f3f4f6;align-items:center}.gp img{width:44px;height:44px;border-radius:6px;object-fit:cover}
 .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#16a34a}.dot.off{background:#dc2626} .hint{color:#6b7280;font-size:13px;margin:6px 0}
 #big{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center} #big img{max-width:90%;max-height:90%;border-radius:8px}
</style></head><body>
<header><b>Attendance</b>
 <a data-t="live" class="on">Dashboard</a><a data-t="punches">Punches</a><a data-t="daily">Daily</a><a data-t="monthly">Monthly</a><a data-t="devices">Devices</a><a data-t="emp">Employees</a><a data-t="sites">Sites</a>
 <span id="conn" style="margin-left:auto;font-size:12px">●</span></header>
<main id="m"></main><div id="big" onclick="this.style.display='none'"><img></div>
<script>
const $=s=>document.querySelector(s), m=$('#m'); let tab='live';
const enc=v=>encodeURIComponent(v??'').replace(/'/g,'%27');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const j=async(u,o)=>{const r=await fetch(u,o); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.detail||r.status); return d};
const post=(u,b)=>j(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
// cols: [key,label,optional render fn returning trusted HTML]
const tbl=(cols,rows)=>`<table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c[0]=='status'?esc(r.status):''}">${c[2]?c[2](r):esc(r[c[0]])}</td>`).join('')}</tr>`).join('')}</table>`;
const punchCols=[
 ['ts','Time',r=>`<span class="${r.flag=='rejected'?'rejected':''}">${esc(r.ts.slice(11))}</span>`],
 ['name','Name'],['device_user_id','ID'],
 ['method','Via',r=>`<span class="tag">${r.method=='app'?'App':esc(devName(r.source)||r.method)}</span>`],
 ['site','Place',r=>r.method!='app'?'':`${esc(r.site||'—')}${r.distance_m!=null?' · '+Math.round(r.distance_m)+' m':''} ${r.lat!=null?`<a target="_blank" href="https://maps.google.com/?q=${r.lat},${r.lng}">map</a>`:''}`],
 ['selfie','Selfie',r=>r.selfie?`<img class="th" src="/api/selfies/${esc(r.selfie)}" onclick="big(this.src)">`:''],
 ['flag','Status',r=>r.flag=='outside_geofence'?'<span class="tag warn">outside area</span>':r.flag=='rejected'?'<span class="tag bad">rejected</span>':r.flag=='approved'?'<span class="tag good">approved</span>':''],
 ['id','',r=>r.method=='app'?(r.flag=='rejected'?`<button onclick="review(${r.id},'')">Restore</button>`:`<button onclick="review(${r.id},'rejected')">Reject</button>${r.flag=='outside_geofence'?`<button onclick="review(${r.id},'approved')">Approve</button>`:''}`):'']];
let devs=[];
const devName=id=>{const d=devs.find(x=>x.dev_id==id);return d?(d.name||d.dev_id):id};
const devSel=()=>`<select id="dv"><option value="">All devices</option>${devs.map(d=>`<option value="${esc(d.dev_id)}">${esc(d.name||d.dev_id)}${d.location?' / '+esc(d.location):''}</option>`).join('')}<option value="app">Mobile app</option></select>`;
const dq=()=>{const v=$('#dv')?$('#dv').value:'';return v?'&device='+encodeURIComponent(v):''};
function go(t){document.querySelector(`header a[data-t=${t}]`).click()}
function big(src){const b=$('#big');b.querySelector('img').src=src;b.style.display='flex'}
async function review(id,flag){await post(`/api/punches/${id}/review`,{flag});render()}
async function render(){
 try{
 devs=await j('/api/devices');
 if(tab=='live'){
  const d=await j('/api/dashboard'); const mx=Math.max(1,...d.departments.map(x=>x.present));
  m.innerHTML=`<div id="feed"></div>
  <div class="grid">
   <div class="stat" style="--c:#16a34a" onclick="go('daily')"><span>Total Employees</span><b>${d.total}</b></div>
   <div class="stat" style="--c:#2563eb" onclick="go('daily')"><span>Total Present</span><b>${d.present}</b></div>
   <div class="stat" style="--c:#dc2626" onclick="go('daily')"><span>Total Absent</span><b>${d.absent}</b></div>
   <div class="stat" style="--c:#f59e0b" onclick="go('daily')"><span>Total Late</span><b>${d.late}</b></div></div>
  <div class="two"><div>
   <div class="panel"><h4>Department wise present</h4><div class="bars">${d.departments.map(x=>`<div><em>${x.present}</em><i style="height:${Math.round(x.present/mx*110)+4}px"></i><u>${esc(x.name)}</u></div>`).join('')||'<p class="hint">No data yet</p>'}</div></div>
   <div class="panel" style="--c:#f59e0b"><h4>Machine connection status</h4>${tbl([['n','S.N.',r=>r._i],['name','Machine',r=>esc(r.name||r.dev_id)],['location','Location'],['total_logs','Logs received'],['last_punch','Last punching time',r=>esc(r.last_punch||'—')],['online','Connected',r=>`<span class="dot ${r.online?'':'off'}"></span>`]],d.devices.map((x,i)=>({...x,_i:i+1})))}</div></div>
   <div class="panel" style="--c:#0891b2"><h4>GPS punches (today)</h4>${d.gps_punches.map(g=>`<div class="gp">${g.selfie?`<img src="/api/selfies/${esc(g.selfie)}" onclick="big(this.src)">`:''}<div><b>${esc(g.device_user_id)}: ${esc(g.name)}</b><div class="hint">${esc(g.ts.slice(11,16))} · ${esc(g.site||'outside sites')}${g.flag=='outside_geofence'?' ⚠':''} · <a target="_blank" href="https://maps.google.com/?q=${g.lat},${g.lng}">map</a></div></div></div>`).join('')||'<p class="hint" style="padding:14px">No app punches today</p>'}</div></div>`;
 } else if(tab=='punches'){
  m.innerHTML=`<div class="bar"><input type="date" id="d" value="${today()}"> ${devSel()}</div><div id="t"></div>`;
  const load=async()=>$('#t').innerHTML=tbl(punchCols,await j('/api/punches?day='+$('#d').value+dq()));
  $('#d').onchange=load; $('#dv').onchange=load; load();
 } else if(tab=='daily'){
  m.innerHTML=`<div class="bar"><input type="date" id="d" value="${today()}"> ${devSel()} <a href="#" id="csv">Download CSV</a></div><div id="t"></div>`;
  const load=async()=>$('#t').innerHTML=tbl([['name','Name'],['department','Dept'],['first_in','In'],['last_out','Out'],['hours','Hours'],['status','Status']],await j('/api/reports/daily?day='+$('#d').value+dq()));
  $('#d').onchange=load; $('#dv').onchange=load; $('#csv').onclick=e=>{e.target.href='/api/reports/daily.csv?day='+$('#d').value+dq()}; load();
 } else if(tab=='monthly'){
  m.innerHTML=`<div class="bar"><input type="month" id="mo" value="${today().slice(0,7)}"> ${devSel()} <a href="#" id="csv">Download CSV</a></div><div id="t"></div>`;
  const load=async()=>$('#t').innerHTML=tbl([['name','Name'],['department','Dept'],['days_present','Days present'],['total_hours','Total hours']],await j('/api/reports/monthly?month='+$('#mo').value+dq()));
  $('#mo').onchange=load; $('#dv').onchange=load; $('#csv').onclick=e=>{e.target.href='/api/reports/monthly.csv?month='+$('#mo').value+dq()}; load();
 } else if(tab=='devices'){
  m.innerHTML=`<p class="hint">Devices appear here automatically the first time they contact the server. Online = heard from in the last 90 seconds.</p><div id="t"></div>`;
  $('#t').innerHTML=tbl([['name','Name',r=>esc(r.name||r.dev_id)],['location','Location'],['dev_id','Device ID'],['model','Model',r=>esc(r.model)+(r.firmware?' <span class="hint">'+esc(r.firmware)+'</span>':'')],['online','Status',r=>r.online?'<span class="tag good">Online</span>':'<span class="tag bad">Offline</span>'],['last_seen','Last seen'],['x','',r=>`<button onclick="renameDev('${enc(r.dev_id)}','${enc(r.name)}','${enc(r.location)}')">Edit</button>`]],devs);
 } else if(tab=='emp'){
  m.innerHTML=`<div class="bar"><input id="i" placeholder="Employee / device ID"><input id="n" placeholder="Name"><input id="dp" placeholder="Department"><button id="s">Save</button></div>
   <p class="hint">Use the same ID that is enrolled on the fingerprint device. Set a PIN so the person can use the phone app.</p><div id="t"></div>`;
  const load=async()=>{$('#t').innerHTML=tbl([['device_user_id','ID'],['name','Name'],['department','Dept'],['active','Active'],
    ['pin','App PIN',r=>`<button onclick="setPin('${enc(r.device_user_id)}')">${r.pin_hash?'Change':'Set'} PIN</button>`],
    ['x','',r=>`<button onclick="edit('${enc(r.device_user_id)}','${enc(r.name)}','${enc(r.department)}')">Edit</button>`]],await j('/api/employees'))};
  $('#s').onclick=async()=>{await post('/api/employees',{device_user_id:$('#i').value,name:$('#n').value,department:$('#dp').value});load()}; load();
 } else {
  m.innerHTML=`<div class="bar"><input id="sn" placeholder="Site name"><input id="la" placeholder="Latitude" size=10><input id="lo" placeholder="Longitude" size=10><input id="ra" placeholder="Radius (m)" value="150" size=6><button id="gps">Use my location</button><button id="s">Add site</button></div>
   <p class="hint">App punches must be within the radius of a site. With no sites, locations are recorded but never blocked. Tip: stand at the office, open this page on your phone and tap "Use my location".</p><div id="t"></div>`;
  const load=async()=>$('#t').innerHTML=tbl([['name','Name'],['lat','Latitude'],['lng','Longitude'],['radius_m','Radius (m)'],['id','',r=>`<button onclick="delSite(${r.id})">Remove</button>`]],await j('/api/sites'));
  $('#gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{$('#la').value=p.coords.latitude.toFixed(6);$('#lo').value=p.coords.longitude.toFixed(6)},e=>alert('Location unavailable: '+e.message));
  $('#s').onclick=async()=>{try{await post('/api/sites',{name:$('#sn').value,lat:+$('#la').value,lng:+$('#lo').value,radius_m:+$('#ra').value});load()}catch(e){alert(e.message)}}; load();
 }
 }catch(e){m.innerHTML=`<p class="Absent">Error: ${esc(e.message)}</p>`}
}
async function renameDev(id,n,l){id=decodeURIComponent(id);const name=prompt('Device name (e.g. Mumbai Office):',decodeURIComponent(n));if(name===null)return;const loc=prompt('Location:',decodeURIComponent(l));if(loc===null)return;try{await post(`/api/devices/${encodeURIComponent(id)}/info`,{name,location:loc});render()}catch(e){alert(e.message)}}
function edit(i,n,d){tab='emp';document.querySelector('#i').value=decodeURIComponent(i);$('#n').value=decodeURIComponent(n);$('#dp').value=decodeURIComponent(d)}
async function setPin(id){id=decodeURIComponent(id);const p=prompt('New PIN for '+id+' (4-8 digits):'); if(!p)return; try{await post(`/api/employees/${encodeURIComponent(id)}/pin`,{pin:p});alert('PIN saved');render()}catch(e){alert(e.message)}}
async function delSite(id){if(confirm('Remove this site?')){await j('/api/sites/'+id,{method:'DELETE'});render()}}
document.querySelectorAll('header a').forEach(a=>a.onclick=()=>{document.querySelectorAll('header a').forEach(x=>x.classList.remove('on'));a.classList.add('on');tab=a.dataset.t;render()});
function connect(){
 const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>{$('#conn').style.color='#4ade80';ws.send('hi')}; ws.onclose=()=>{$('#conn').style.color='#f87171';setTimeout(connect,2000)};
 ws.onmessage=e=>{const p=JSON.parse(e.data); if(tab!='live')return; const d=document.createElement('div');d.className='toast';d.textContent=`${p.ts.slice(11)}  ${p.name} checked in${p.flag=='outside_geofence'?' (outside area)':''}`;$('#feed').prepend(d);setTimeout(render,500)};
}
render(); connect();
</script></body></html>
