// The Play Store app: a native Android app (Kotlin, Jetpack Compose) for employees. It talks to the attendance
// server's /api/app endpoints, the same ones the phone web app uses. Built by .github/workflows/android.yml.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keystore = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.madarwala.attendance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.madarwala.attendance'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '1.0.0'
        buildConfigField 'String', 'SERVER', '"https://attendance.madarwala.cloud"'
    }

    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
}
