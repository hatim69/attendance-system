<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f4f5f7;color:#1c1e21}
 header{background:#1f2937;color:#fff;padding:12px 20px;display:flex;gap:20px;align-items:center}
 header a{color:#cbd5e1;cursor:pointer;padding:4px 8px;border-radius:4px}
 header a.on{background:#374151;color:#fff}
 main{padding:20px;max-width:1000px;margin:auto}
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden}
 th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #eee}
 th{background:#f9fafb;font-size:12px;text-transform:uppercase;color:#6b7280}
 .Present{color:#15803d}.Late{color:#b45309}.Absent{color:#b91c1c}
 .toast{background:#dcfce7;border-left:4px solid #16a34a;padding:10px 14px;margin:6px 0;border-radius:4px;animation:in .3s}
 @keyframes in{from{opacity:0;transform:translateY(-6px)}}
 input,button{padding:6px 10px;margin:2px;font-size:14px}
 .bar{margin-bottom:12px}
</style></head><body>
<header><b>Attendance</b>
 <a data-t="live" class="on">Live</a><a data-t="daily">Daily</a><a data-t="monthly">Monthly</a><a data-t="emp">Employees</a>
 <span id="conn" style="margin-left:auto;font-size:12px">●</span></header>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s), m=$('#m'); let tab='live';
const today=()=>new Date().toLocaleDateString('en-CA');
const j=async(u,o)=>(await fetch(u,o)).json();
const tbl=(cols,rows)=>`<table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c[0]=='status'?r.status:''}">${r[c[0]]??''}</td>`).join('')}</tr>`).join('')}</table>`;
async function render(){
 if(tab=='live'){
  m.innerHTML=`<h3>Live check-ins</h3><div id="feed"></div><h3>Today's punches</h3><div id="log"></div>`;
  $('#log').innerHTML=tbl([['ts','Time'],['name','Name'],['device_user_id','ID'],['source','Device']],await j('/api/punches'));
 } else if(tab=='daily'){
  m.innerHTML=`<div class="bar"><input type="date" id="d" value="${today()}"><a href="#" id="csv">Download CSV</a></div><div id="t"></div>`;
  const load=async()=>$('#t').innerHTML=tbl([['name','Name'],['department','Dept'],['first_in','In'],['last_out','Out'],['hours','Hours'],['status','Status']],await j('/api/reports/daily?day='+$('#d').value));
  $('#d').onchange=load; $('#csv').onclick=e=>{e.target.href='/api/reports/daily.csv?day='+$('#d').value}; load();
 } else if(tab=='monthly'){
  m.innerHTML=`<div class="bar"><input type="month" id="mo" value="${today().slice(0,7)}"></div><div id="t"></div>`;
  const load=async()=>$('#t').innerHTML=tbl([['name','Name'],['department','Dept'],['days_present','Days present'],['total_hours','Total hours']],await j('/api/reports/monthly?month='+$('#mo').value));
  $('#mo').onchange=load; load();
 } else {
  m.innerHTML=`<div class="bar"><input id="i" placeholder="Device user ID"><input id="n" placeholder="Name"><input id="dp" placeholder="Department"><button id="s">Save</button></div><div id="t"></div>`;
  const load=async()=>$('#t').innerHTML=tbl([['device_user_id','ID'],['name','Name'],['department','Dept'],['active','Active']],await j('/api/employees'));
  $('#s').onclick=async()=>{await fetch('/api/employees',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_user_id:$('#i').value,name:$('#n').value,department:$('#dp').value})});load()}; load();
 }
}
document.querySelectorAll('header a').forEach(a=>a.onclick=()=>{document.querySelectorAll('header a').forEach(x=>x.classList.remove('on'));a.classList.add('on');tab=a.dataset.t;render()});
function connect(){
 const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>{$('#conn').style.color='#4ade80';ws.send('hi')}; ws.onclose=()=>{$('#conn').style.color='#f87171';setTimeout(connect,2000)};
 ws.onmessage=e=>{const p=JSON.parse(e.data); if(tab!='live')return; const d=document.createElement('div');d.className='toast';d.textContent=`${p.ts.slice(11)}  ${p.name} checked in`;$('#feed').prepend(d);setTimeout(render,500)};
}
render(); connect();
</script></body></html>
