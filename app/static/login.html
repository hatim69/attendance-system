<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance login</title>
<style>
 body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
 form{background:#fff;padding:28px;border-radius:14px;box-shadow:0 2px 10px #0002;width:min(360px,92vw)}
 h1{font-size:22px;margin:0 0 18px} input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #d1d5db;border-radius:8px;margin:6px 0 14px}
 button{width:100%;padding:13px;font-size:16px;font-weight:600;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
 #err{color:#991b1b;background:#fee2e2;padding:10px;border-radius:8px;margin-bottom:12px;display:none}
</style></head><body>
<form id="f"><h1>Attendance admin</h1><div id="err"></div>
 <label>Username</label><input id="u" autocomplete="username" autofocus>
 <label>Password</label><input id="p" type="password" autocomplete="current-password">
 <button>Log in</button></form>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.style.display='none';
 const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});
 if(r.ok){location.href='/'}else{const d=await r.json().catch(()=>({}));err.textContent=typeof d.detail=='string'?d.detail:'Login failed';err.style.display='block'}};
</script></body></html>
