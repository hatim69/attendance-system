# Attendance system: app (dashboard/API on 8000, device listener on 80) + Caddy (automatic HTTPS on 443).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FKWEB_PORT: "80"
      REQUIRE_LOGIN: "1"   # refuse to start with no login configured
    ports:
      - "80:80"        # fingerprint devices post here over plain HTTP (the device cannot do HTTPS)
    volumes:
      - ./data:/data   # database + selfies: back this folder up
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
