# Used when the VPS already runs nginx on ports 80/443 (shared server): the app listens only on localhost and nginx
# forwards to it. Started by deploy/install.sh (MODE=nginx):  docker compose -f docker-compose.nginx.yml up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FKWEB_PORT: "80"
      REQUIRE_LOGIN: "1"
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"   # dashboard / API / phone app
      - "127.0.0.1:${FK_PORT:-18081}:80"      # fingerprint devices (nginx forwards requests carrying a request_code header here)
    volumes:
      - ./data:/data
