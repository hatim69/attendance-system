<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance · Admin</title>
<link rel="icon" href="/m/icon-192.png">
<style>
:root{--bg:#f4f6fb;--panel:#fff;--line:#e5e8f0;--line2:#eef1f6;--text:#0f172a;--muted:#64748b;--soft:#94a3b8;
 --brand:#4f46e5;--brand-d:#4338ca;--brand-l:#eef2ff;--side:#0b1220;--side2:#131c2e;
 --ok:#16a34a;--ok-l:#dcfce7;--warn:#d97706;--warn-l:#fef3c7;--bad:#dc2626;--bad-l:#fee2e2;--vio:#7c3aed;--vio-l:#ede9fe;--org:#ea580c;--org-l:#ffedd5;--sky:#0284c7;--sky-l:#e0f2fe;
 --r:12px;--sh:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.04)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* sidebar */
#side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brand{display:flex;gap:11px;align-items:center;padding:18px 18px 14px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.logo svg.i{width:22px;height:22px}
.brand b{color:#fff;font-size:14.5px;display:block;line-height:1.25;max-width:170px}.brand small{color:#7c8aa5;font-size:12px}
#nav{flex:1;overflow-y:auto;padding:4px 10px 12px}
#nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#56627a;font-weight:700;padding:16px 10px 6px}
#nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:#aab6cb;cursor:pointer;font-size:13.5px;margin:1px 0;position:relative}
#nav a:hover{background:var(--side2);color:#fff}
#nav a.on{background:#1b2540;color:#fff}
#nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#818cf8}
#nav a.on svg.i{color:#a5b4fc}
.badge{margin-left:auto;background:#f59e0b;color:#1f1300;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.badge:empty{display:none}
.me{border-top:1px solid #1c2638;padding:12px 14px;display:flex;align-items:center;gap:10px}
.me .av{width:34px;height:34px;font-size:13px}
.me .mi{flex:1;min-width:0}.me b{color:#fff;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:#7c8aa5;font-size:11.5px;text-transform:capitalize}
.me button{background:none;border:0;color:#7c8aa5;cursor:pointer;padding:6px;border-radius:6px;display:grid}.me button:hover{background:var(--side2);color:#fff}
/* main */
.shell{margin-left:248px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.88);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:18px 28px 14px}
.top h1{margin:0;font-size:21px;letter-spacing:-.01em}.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;white-space:nowrap}
#menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px;cursor:pointer}
.live{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 8px;font-weight:600;font-size:12px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--soft)}.live.on i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-l)}.live.off i{background:var(--bad)}
main{padding:4px 28px 40px;max-width:1400px;width:100%}
/* building blocks */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.ch h3{margin:0;font-size:14.5px;font-weight:650}.ch .ca{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cb{padding:16px 18px}
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:14px 18px;border-bottom:1px solid var(--line2)}
.tb .sp{flex:1}
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.hint{color:var(--muted);font-size:13px;margin:0}
input,select,textarea{font:inherit;color:inherit;height:36px;padding:0 11px;border:1px solid #d6dbe6;border-radius:8px;background:#fff;outline:none;min-width:0}
textarea{height:auto;padding:8px 11px}
input[type=checkbox]{flex:none;width:16px;height:16px;accent-color:var(--brand);vertical-align:-3px;margin:0 6px 0 0}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
input[readonly]{background:#f8fafc;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}.f>span{font-size:12px;font-weight:600;color:#475569}
.f.w{grid-column:1/-1}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.fg.one{grid-template-columns:1fr}
.chk{display:inline-flex;align-items:center;font-size:13px;color:#334155;cursor:pointer;min-height:36px}
.btn,button{font:inherit;font-weight:600;font-size:13px;height:36px;padding:0 14px;border-radius:8px;border:1px solid #d6dbe6;background:#fff;color:#1e293b;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
.btn:hover,button:hover{background:#f8fafc;border-color:#c5ccda}
.btn.pri,button.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.3)}
.btn.pri:hover,button.pri:hover{background:var(--brand-d)}
.btn.danger,button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button.sm,.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
button.lnk{border:0;background:none;color:var(--brand);padding:0 6px;height:auto}
button.lnk.red{color:var(--bad)}
button:disabled{opacity:.55;cursor:default}
.btn svg.i,button svg.i{width:16px;height:16px}
/* tables */
.tw{overflow:auto;max-height:calc(100vh - 210px)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.2px}
th{position:sticky;top:0;z-index:1;background:#f8fafc;color:#64748b;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tbody tr:hover td{background:#fafbff}
tbody tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .acts{display:flex;gap:6px;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:20px;background:#f1f5f9;color:#475569;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:#166534}.pill.warn{background:var(--warn-l);color:#92400e}.pill.bad{background:var(--bad-l);color:#991b1b}
.pill.violet{background:var(--vio-l);color:#5b21b6}.pill.orange{background:var(--org-l);color:#9a3412}.pill.sky{background:var(--sky-l);color:#075985}.pill.mute{background:#f1f5f9;color:#64748b}
.pill.brand{background:var(--brand-l);color:var(--brand-d)}
.strike{text-decoration:line-through;color:var(--soft)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.who{display:flex;align-items:center;gap:10px}.who b{font-weight:600}.who small{display:block;color:var(--muted);font-size:12px}
img.th{width:40px;height:40px;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block}
.empty{text-align:center;padding:42px 20px;color:var(--soft)}.empty svg.i{width:34px;height:34px;stroke-width:1.4}.empty p{margin:8px 0 0;color:var(--muted)}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,23,42,.07)}
.kpi .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--l);color:var(--c)}.kpi .ic svg.i{width:21px;height:21px}
.kpi span{color:var(--muted);font-size:12.5px;font-weight:600}.kpi b{display:block;font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:2px 0}
.kpi small{color:var(--muted);font-size:12px}
.meter{height:6px;border-radius:6px;background:#eef1f6;overflow:hidden;margin-top:8px;width:100%}.meter i{display:block;height:100%;background:var(--c);border-radius:6px}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr 36px;gap:12px;align-items:center;padding:7px 0;font-size:13px}
.hbar>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#334155}.hbar>b{text-align:right;font-variant-numeric:tabular-nums}
.hbar .meter{margin:0;height:9px}.hbar .meter i{background:linear-gradient(90deg,#818cf8,#6366f1)}
.rows>div{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line2)}.rows>div:last-child{border-bottom:0}
.rows .t{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}.rows .t b{display:block;color:var(--text);font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px var(--ok-l)}.dot.off{background:#cbd5e1;box-shadow:0 0 0 3px #f1f5f9}
.banner{display:flex;align-items:center;gap:12px;background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:var(--r);padding:11px 16px;margin-bottom:18px;cursor:pointer}
.banner svg.i{color:#d97706}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line2)}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;height:auto;font-weight:500}
.chip b{font-variant-numeric:tabular-nums}.chip.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
/* attendance sheet */
table.sheet td,table.sheet th{padding:6px 4px;text-align:center;font-size:11.5px;min-width:30px}
table.sheet td:first-child,table.sheet th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:2;padding-left:14px;min-width:170px}
table.sheet th:first-child{background:#f8fafc;z-index:3}
.cd{display:inline-block;min-width:24px;padding:2px 0;border-radius:5px;font-weight:700;font-size:10.5px}
.c-P{background:var(--ok-l);color:#166534}.c-L{background:var(--warn-l);color:#92400e}.c-HD{background:var(--org-l);color:#9a3412}.c-A{background:var(--bad-l);color:#991b1b}.c-LV{background:var(--vio-l);color:#5b21b6}.c-H{background:var(--sky-l);color:#075985}.c-WO{background:#f1f5f9;color:#94a3b8}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;gap:5px;align-items:center}
/* pickers */
.pick{border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px}
.pick label{padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick label:hover{background:#f8fafc}
.pick small{color:var(--muted)}
.perm{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.policy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px 18px}
.policy div{background:#f8fafc;border:1px solid var(--line2);border-radius:10px;padding:12px 14px}.policy b{display:block;font-size:13.5px;margin-bottom:3px}.policy span{color:var(--muted);font-size:12.5px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:18px}
.step{border:1px dashed #cfd6e4;border-radius:11px;padding:14px;display:flex;flex-direction:column;gap:10px}
.step>b{display:flex;align-items:center;gap:8px}.step>b i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-size:12px}
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-bottom:18px}
.dev{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.dev h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}.dev dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0;font-size:12.5px}.dev dt{color:var(--muted)}.dev dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f1f5f9;border-radius:6px;padding:2px 7px;font-size:12.5px}
.note{background:var(--brand-l);border:1px solid #c7d2fe;color:#312e81;border-radius:10px;padding:10px 14px;font-size:13px}
.note.ok{background:var(--ok-l);border-color:#bbf7d0;color:#14532d}
.totbar{display:flex;gap:28px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line2);font-size:13px;color:var(--muted)}.totbar b{color:var(--text);font-size:16px;display:block}
/* dialog + toasts */
dialog{border:0;border-radius:16px;padding:0;width:min(680px,94vw);box-shadow:0 24px 60px rgba(15,23,42,.25);color:var(--text)}
dialog.sm{width:min(440px,94vw)}
dialog::backdrop{background:rgba(15,23,42,.45);backdrop-filter:blur(2px)}
.dh{padding:18px 22px 4px}.dh h3{margin:0;font-size:17px}.dh p{margin:4px 0 0;color:var(--muted);font-size:13px}
.db{padding:14px 22px;max-height:68vh;overflow:auto}
.df{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line2);background:#fafbfd;border-radius:0 0 16px 16px}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
.tst{background:#0f172a;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.25);font-size:13.5px;max-width:380px;border-left:4px solid #4ade80;animation:tin .18s ease-out}
.tst.bad{border-left-color:#f87171}.tst.info{border-left-color:#818cf8}.tst.out{opacity:0;transform:translateY(6px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#big{position:fixed;inset:0;background:rgba(2,6,23,.82);display:none;align-items:center;justify-content:center;z-index:90;cursor:zoom-out}#big img{max-width:92%;max-height:92%;border-radius:12px}
.scrim{display:none}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,#eef1f6 25%,#f6f8fb 37%,#eef1f6 63%);background-size:400% 100%;animation:sk 1.2s infinite;margin-bottom:18px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2e{grid-template-columns:1fr}}
@media(max-width:900px){
 #side{transform:translateX(-100%)}body.nav-open #side{transform:none}
 body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:25}
 .shell{margin-left:0}#menuBtn{display:grid}.top{padding:14px 16px 10px}main{padding:4px 16px 32px}
 .top .r .dt{display:none}.policy,.steps{grid-template-columns:1fr}
}
@media(max-width:520px){.kpis{gap:12px}.kpi{padding:14px}.kpi b{font-size:24px}.kpi .ic{display:none}.top h1{font-size:18px}.top p{display:none}}
</style></head><body>

<script>

 d.returnValue='';d.onclose=()=>res(d.returnValue=='ok'?fields.map((f,i)=>d.querySelector(`[name=f${i}]`).value):null);d.showModal();const f=d.querySelector('input');if(f)f.focus()})}

  const drawPerms=(sel)=>{const r=$('#ur').value; const list=r=='hr'?Object.keys(PL):r=='manager'?MG:[];
   $('#permbox').innerHTML=list.length?`<div class="f"><span>${r=='hr'?'HR abilities':'Extra abilities (for their own team)'}</span><div class="perm">${list.map(k=>`<label class="chk" style="height:30px"><input type="checkbox" class="pm" value="${k}" ${sel.includes(k)?'checked':''}>${PL[k]}</label>`).join('')}</div></div>`:'<p class="hint">Admin and Management always have every ability.</p>'};
  $('#ur').onchange=()=>drawPerms($('#ur').value=='hr'?HRD:[]); drawPerms([]);
  $('#uadd').onclick=()=>{['un','ud','up','ut'].forEach(k=>$('#'+k).value='');$('#un').readOnly=false;$('#up').placeholder='at least 8 characters';$('#ur').value='manager';$('#ua').checked=true;$('#ur').onchange();$('#userDlg .dt').textContent='Add user';$('#userDlg').showModal()};
  const us=await j('/api/users'); listCache=us;
  $('#t').innerHTML=tbl([['username','User',r=>person(r.display_name||r.username,r.username)],['role','Role',r=>pill((ROLE[r.role]||[r.role])[0],(ROLE[r.role]||[])[1])],['department','Team',r=>esc(r.role=='manager'?r.department:'')],['permissions','Abilities',r=>`<span class="muted small">${esc(r.role=='hr'?(r.permissions=='*'||!r.permissions?'all HR abilities':r.permissions.split(',').map(k=>PL[k]||k).join(', ')):r.role=='manager'?(r.permissions?'team basics + '+r.permissions.split(',').map(k=>PL[k]||k).join(', '):'team basics'):'everything')}</span>`],['active','Status',r=>r.active?pill('Active','ok'):pill('Disabled','mute')],['x','',r=>`<div class="acts"><button class="sm" onclick="editUser(${listCache.indexOf(r)})">Edit</button><button class="sm" onclick="delUser(${listCache.indexOf(r)})">Delete</button></div>`]],us);
  $('#s').onclick=safe(async()=>{const perms=$$('.pm:checked').map(c=>c.value).join(',');await post('/api/users',{username:$('#un').value,display_name:$('#ud').value,password:$('#up').value,role:$('#ur').value,department:$('#ut').value,active:$('#ua').checked,permissions:$('#ur').value=='hr'&&perms==HRD.join(',')?'*':perms});$('#userDlg').close();toast('User saved');render()});

 } else if(tab=='audit'){
  const a=await j('/api/audit');
  m.innerHTML=card('',`<div class="tb"><p class="hint" style="flex:1;align-self:center">Who changed what, and whether it worked. Request contents such as passwords are never logged.</p><input id="aq" placeholder="Filter…" style="width:220px"></div><div id="t"></div>`);
  const draw=()=>{const q=$('#aq').value.toLowerCase();$('#t').innerHTML=tbl([['ts','Time',r=>`<span class="muted">${esc(r.ts)}</span>`],['user','User',r=>`<b>${esc(r.user)}</b>`],['action','Action',r=>`<span class="code">${esc(r.action)}</span>`],['status','Result',r=>+r.status<400?pill(r.status,'ok'):pill(r.status,'bad')]],a.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)),{empty:'Nothing logged yet'})};
  $('#aq').oninput=draw; draw();

 } else if(tab=='devices'){
  listCache=devs; const url='http://'+location.hostname;
  m.innerHTML=`<div class="devs">${devs.map((d,i)=>`<div class="dev"><h4><span class="dot ${d.online?'':'off'}"></span>${esc(d.name||d.dev_id)}<span style="margin-left:auto">${d.online?pill('Online','ok'):pill('Offline','mute')}</span></h4>
    <dl><dt>Location</dt><dd>${esc(d.location||'—')}</dd><dt>Device ID</dt><dd><span class="code">${esc(d.dev_id)}</span></dd><dt>Model</dt><dd>${esc(d.model||'—')}${d.firmware?` <span class="muted">${esc(d.firmware)}</span>`:''}</dd><dt>Last seen</dt><dd>${esc(d.last_seen||'never')}</dd></dl>
    <button class="sm" onclick="renameDev(${i})">${I('edit')}Rename</button></div>`).join('')}</div>
   ${card('Connect a fingerprint machine',`<div class="cb"><ol style="margin:0;padding-left:18px;line-height:1.9"><li>On the machine open <b>Menu → Comm. → Webserver</b> (or Cloud server).</li><li>Set the server mode to <b>FkWeb</b> and the Webserver URL to <span class="code">${esc(url)}</span>. Use plain <b>http</b>, not https.</li><li>Save and restart the machine. It appears here by itself within a minute. Online means it was heard from in the last 90 seconds.</li></ol></div>`)}`;
  if(!devs.length)m.insertAdjacentHTML('afterbegin',card('',emptyBox('No machine has connected yet. Follow the steps below.')));

 } else if(tab=='emp'){
  listCache=emps; const depts=[...new Set(emps.map(e=>e.department).filter(Boolean))].sort();
  m.innerHTML=card('',`<div class="tb"><div style="position:relative">${fld('Search',`<input id="q" placeholder="Name, ID, department…" style="width:240px">`)}</div>${fld('Department',`<select id="qd"><option value="">All</option>${depts.map(d=>`<option>${esc(d)}</option>`).join('')}</select>`)}<label class="chk"><input type="checkbox" id="qr">Show resigned</label><div class="sp"></div><button class="pri" id="eadd">${I('plus')}Add employee</button></div>
   <div class="tb" style="background:#fafbfd">${fld('Shift for the ticked people',shiftSel('bs'))}<button id="bb">Assign shift</button><span class="hint" style="align-self:center" id="ecount"></span></div><div id="t"></div>`)+
   formDlg('empDlg','Add employee',`<div class="fg">${fld('Employee / device ID',`<input id="i" placeholder="same as on the machine">`)}${fld('Full name',`<input id="n">`)}${fld("Father's name",`<input id="fn">`)}${fld('Mobile',`<input id="mb" inputmode="tel">`)}${fld('Department',`<input id="dp" list="deptList">`)}${fld('Designation',`<input id="dg">`)}${fld('Branch',`<input id="br">`)}${fld('Shift',shiftSel('es'))}${fld('Monthly salary',`<input id="sal" type="number" min="0">`)}${fld('Joining date',`<input type="date" id="jd">`)}<label class="chk" style="align-self:end"><input type="checkbox" id="ac" checked>Active (untick when someone resigns)</label></div><datalist id="deptList">${depts.map(d=>`<option value="${esc(d)}">`).join('')}</datalist><p class="hint" style="margin-top:12px">IDs ignore leading zeros (00217315 = 217315). Set an app PIN from the list so the person can use the phone app.</p>`,'s','Save employee');
  const draw=()=>{const q=$('#q').value.toLowerCase(), dd=$('#qd').value, rs=$('#qr').checked;
   const rows=emps.filter(e=>(rs||e.active)&&(!dd||e.department==dd)&&(!q||[e.name,e.device_user_id,e.department,e.designation,e.branch,e.mobile].join(' ').toLowerCase().includes(q)));
   $('#ecount').textContent=`${rows.length} of ${emps.length} employees`;
   $('#t').innerHTML=tbl([['sel','<input type="checkbox" id="all">',r=>`<input type="checkbox" class="sel" value="${esc(r.device_user_id)}">`],['name','Employee',r=>person(r.name,'ID '+r.device_user_id)],['department','Department',r=>`${esc(r.department)}${r.designation?`<div class="small muted">${esc(r.designation)}</div>`:''}`],['branch','Branch'],['shift','Shift',r=>r.shift?esc(r.shift):'<span class="muted">Flexible</span>'],['salary','Salary',r=>r.salary!=null&&r.salary!==undefined?money(r.salary):'','num'],['joined','Joined',r=>`<span class="muted">${esc(r.joined)}</span>`],['active','Status',r=>r.active?pill('Active','ok'):pill('Resigned','mute')],
    ['x','',r=>`<div class="acts"><button class="sm" onclick="setPin(${listCache.indexOf(r)})">${r.pin_hash?'Change PIN':'Set PIN'}</button><button class="sm" onclick="editEmp(${listCache.indexOf(r)})">Edit</button></div>`]],rows,{empty:emps.length?'Nobody matches the search':'No employees yet. Add them here, or bring them in from Import data.'});
   const all=$('#all'); if(all)all.onclick=e=>$$('.sel').forEach(c=>c.checked=e.target.checked)};
  $('#q').oninput=draw; $('#qd').onchange=draw; $('#qr').onchange=draw; draw();
  $('#eadd').onclick=()=>{['i','n','dp','dg','br','mb','fn','sal','jd'].forEach(k=>$('#'+k).value='');$('#i').readOnly=false;$('#es').value='';$('#ac').checked=true;$('#empDlg .dt').textContent='Add employee';$('#empDlg').showModal();$('#i').focus()};
  $('#bb').onclick=safe(async()=>{const ids=$$('.sel:checked').map(c=>c.value);if(!ids.length)throw new Error('Tick at least one employee in the list');
   const r=await post('/api/employees/bulk-shift',{ids,shift_id:$('#bs').value?+$('#bs').value:null});toast(r.updated+' employee'+(r.updated==1?'':'s')+' updated');render()});
  $('#s').onclick=safe(async()=>{await post('/api/employees',{device_user_id:$('#i').value,name:$('#n').value,department:$('#dp').value,designation:$('#dg').value,branch:$('#br').value,mobile:$('#mb').value,father_name:$('#fn').value,active:$('#ac').checked,shift_id:$('#es').value?+$('#es').value:null,salary:+($('#sal').value||0),joined:$('#jd').value});$('#empDlg').close();toast('Employee saved');render()});

 } else {
  m.innerHTML=card('',`<div class="tb"><p class="hint" style="flex:1;align-self:center">Phone check-ins must be within the radius of a site. With no sites, locations are recorded but never blocked. Tip: stand at the office, open this page on your phone and tap <b>Use my location</b>.</p><button class="pri" id="sadd">${I('plus')}Add site</button></div><div id="t"></div>`)+
   formDlg('siteDlg','Add a GPS site',`<div class="fg">${fld('Site name',`<input id="sn" placeholder="e.g. Mumbai Office">`,1)}${fld('Latitude',`<input id="la">`)}${fld('Longitude',`<input id="lo">`)}${fld('Radius (metres)',`<input id="ra" type="number" value="150">`)}<button type="button" id="gps" style="align-self:end">${I('pin')}Use my location</button></div>`,'s','Add site');
  const load=async()=>{const st=await j('/api/sites');listCache=st;$('#t').innerHTML=tbl([['name','Site',r=>`<b>${esc(r.name)}</b>`],['lat','Location',r=>`<a target="_blank" rel="noopener" href="https://maps.google.com/?q=${+r.lat},${+r.lng}">${(+r.lat).toFixed(5)}, ${(+r.lng).toFixed(5)}</a>`],['radius_m','Radius',r=>pill(r.radius_m+' m','brand')],['id','',r=>`<div class="acts"><button class="sm" onclick="delSite(${r.id})">Remove</button></div>`]],st,{empty:'No sites yet: phone check-ins are allowed anywhere'})};
  $('#sadd').onclick=()=>$('#siteDlg').showModal();
  $('#gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{$('#la').value=p.coords.latitude.toFixed(6);$('#lo').value=p.coords.longitude.toFixed(6)},e=>toast('Location unavailable: '+e.message,'bad'));
  $('#s').onclick=safe(async()=>{await post('/api/sites',{name:$('#sn').value,lat:+$('#la').value,lng:+$('#lo').value,radius_m:+$('#ra').value});$('#siteDlg').close();toast('Site added');load()}); load();
 }
 }catch(e){m.innerHTML=card('',`<div class="empty">${I('alert')}<p><b>Could not load this page.</b><br>${esc(e.message)}</p></div>`)}
}
// row actions use list indexes (never put text in inline handlers)
function editUser(i){const u=listCache[i];$('#un').value=u.username;$('#un').readOnly=true;$('#ud').value=u.display_name;$('#up').value='';$('#up').placeholder='leave empty to keep';$('#ur').value=u.role;$('#ut').value=u.department;$('#ua').checked=!!u.active;$('#ur').onchange();const sel=(u.permissions&&u.permissions!='*')?u.permissions.split(','):(u.role=='hr'?HRD:[]);$$('.pm').forEach(c=>c.checked=sel.includes(c.value));$('#userDlg .dt').textContent='Edit '+u.username;$('#userDlg').showModal()}
const delUser=safe(async i=>{if(await confirmBox('Delete user '+listCache[i].username+'?','They will no longer be able to sign in.','Delete')){await j('/api/users/'+encodeURIComponent(listCache[i].username),{method:'DELETE'});toast('User deleted');render()}});
const delAdj=safe(async i=>{await j('/api/payroll/adjustments/'+listCache[i].id,{method:'DELETE'});toast('Adjustment removed');render()});
const delShiftChange=safe(async i=>{if(await confirmBox('Remove this shift change?','The person goes back to their normal shift on those dates.','Remove')){await j('/api/shift-changes/'+listCache[i].id,{method:'DELETE'});toast('Shift change removed');render()}});
function editEmp(i){const e=listCache[i];$('#i').value=e.device_user_id;$('#i').readOnly=true;$('#n').value=e.name;$('#dp').value=e.department;$('#dg').value=e.designation||'';$('#br').value=e.branch||'';$('#mb').value=e.mobile||'';$('#fn').value=e.father_name||'';$('#ac').checked=!!e.active;$('#es').value=e.shift_id??'';$('#sal').value=e.salary||'';$('#jd').value=e.joined||'';$('#empDlg .dt').textContent='Edit '+e.name;$('#empDlg').showModal()}
function editShift(i){const s=listCache[i];$('#sid').value=s.id;$('#sn').value=s.name;$('#ss').value=s.start;$('#se').value=s.end;$('#sg').value=s.grace_min;$('#sh').value=s.half_day_hours;$('#so').value=s.ot_after_min;$('#sw').value=s.weekly_off;$('#shiftDlg .dt').textContent='Edit shift';$('#shiftDlg').showModal()}
const delShift=safe(async id=>{if(await confirmBox('Delete this shift?','Its employees become flexible (never late, no overtime).','Delete')){await j('/api/shifts/'+id,{method:'DELETE'});toast('Shift deleted');render()}});
const delHoliday=safe(async i=>{if(await confirmBox('Delete '+listCache[i].name+'?','','Delete')){await j('/api/holidays/'+listCache[i].date,{method:'DELETE'});toast('Holiday deleted');render()}});
const decideLeave=safe(async(i,act)=>{await post(`/api/leaves/${listCache[i].id}/${act}`,{});toast(act=='approve'?'Leave approved':'Leave rejected');render()});
const delLeave=safe(async i=>{if(await confirmBox('Delete this leave?','','Delete')){await j('/api/leaves/'+listCache[i].id,{method:'DELETE'});toast('Leave deleted');render()}});
const delSite=safe(async id=>{if(await confirmBox('Remove this site?','Phone check-ins there will no longer match it.','Remove')){await j('/api/sites/'+id,{method:'DELETE'});toast('Site removed');render()}});
const setPin=safe(async i=>{const e=listCache[i];const v=await ask({title:'App PIN for '+e.name,text:'They sign in to the phone app with ID '+e.device_user_id+' and this PIN.',fields:[{label:'New PIN (4 to 8 digits)',type:'password',attrs:'inputmode="numeric" autocomplete="new-password" maxlength=8'}],ok:'Save PIN'});if(!v||!v[0])return;await post(`/api/employees/${encodeURIComponent(e.device_user_id)}/pin`,{pin:v[0]});toast('PIN saved');render()});
const renameDev=safe(async i=>{const d=listCache[i];const v=await ask({title:'Rename machine',fields:[{label:'Name',value:d.name,ph:'e.g. Mumbai Office'},{label:'Location',value:d.location}]});if(!v)return;await post(`/api/devices/${encodeURIComponent(d.dev_id)}/info`,{name:v[0],location:v[1]});toast('Saved');render()});

/* ---------- navigation, live feed, start ---------- */
let VIS=()=>true;
function route(){let t=location.hash.slice(1)||'live'; if(!PAGES[t]||!VIS(t))t='live'; tab=t; document.body.classList.remove('nav-open'); render()}
$$('#nav a').forEach(a=>a.onclick=()=>{if(location.hash.slice(1)==a.dataset.t)route();else location.hash=a.dataset.t});
window.onhashchange=route;
$('#menuBtn').onclick=()=>document.body.classList.toggle('nav-open');
$('#today').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function connect(){
 const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws'), c=$('#conn');
 ws.onopen=()=>{c.className='live on';ws.send('hi')}; ws.onclose=()=>{c.className='live off';setTimeout(connect,3000)};
 ws.onmessage=e=>{const p=JSON.parse(e.data); toast(`${p.name} punched at ${String(p.ts).slice(11,16)}${p.flag=='outside_geofence'?' (outside area)':''}`,'info'); if(tab=='live'&&!document.querySelector('dialog[open]'))setTimeout(render,400)};
}
setInterval(()=>{if(tab=='live'&&!document.hidden&&!document.querySelector('dialog[open]'))render()},60000);
const NEED={payroll:'payroll',emp:'employees',shifts:'shifts',holidays:'holidays',leave:'leave',import:'import',sites:'sites'};
function visibleTab(t,me){
 const r=me.role; if(r=='admin'||r=='management')return true;
 const raw=(me.permissions&&me.permissions!='*')?me.permissions.split(','):[];
 const eff=r=='hr'?((!me.permissions||me.permissions=='*')?HRD:raw):raw, has=k=>eff.includes(k);
 if(t=='users'||t=='audit')return false;
 if(t=='devices')return true;
 if(t=='shiftchange')return r=='manager'||has('shifts');
 return NEED[t]?has(NEED[t]):true;
}
(async()=>{try{const me=await j('/api/auth/me'); ME=me;
  const name=me.open_mode?'Open mode':(me.display_name||me.username);
  $('#who').textContent=name; $('#meAv').textContent=name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  $('#whoRole').textContent=me.open_mode?'no login set up':((ROLE[me.role]||[me.role])[0]+(me.role=='manager'&&me.department?' · '+me.department:''));
  if(me.company){$('#co').textContent=me.company;$('#co').title=me.company}
  VIS=t=>visibleTab(t,me);
  $$('#nav a[data-t]').forEach(a=>{if(!VIS(a.dataset.t))a.style.display='none'});
  $$('#nav .grp').forEach(g=>{let n=g.nextElementSibling,any=false;while(n&&!n.classList.contains('grp')){if(n.style.display!='none')any=true;n=n.nextElementSibling}if(!any)g.style.display='none'});
  if(me.open_mode){$('#out').style.display=$('#pw').style.display='none'}
  $('#out').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',headers:{'X-Requested-With':'fetch'}});location.href='/login'};
  $('#pw').onclick=safe(async()=>{const v=await ask({title:'Change your password',fields:[{label:'Current password',type:'password',attrs:'autocomplete="current-password"'},{label:'New password (at least 8 characters)',type:'password',attrs:'autocomplete="new-password"'}],ok:'Change password'});if(!v||!v[0]||!v[1])return;await post('/api/auth/password',{old_password:v[0],new_password:v[1]});toast('Password changed')});
  if(['hr','admin','management'].includes(me.role))connect(); else $('#conn').style.display='none';
  route();
 }catch(e){}})();
</script></body></html>
