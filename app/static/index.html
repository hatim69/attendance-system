<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Admin</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f4f5f7;color:#1c1e21}
 header{background:#1f2937;color:#fff;padding:10px 16px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
 header a{color:#cbd5e1;cursor:pointer;padding:5px 10px;border-radius:4px;font-size:14px}
 header a.on{background:#374151;color:#fff}
 main{padding:20px;max-width:1250px;margin:auto;overflow-x:auto}
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden;font-size:14px}
 th,td{padding:7px 10px;text-align:left;border-bottom:1px solid #eee;vertical-align:middle;white-space:nowrap}
 th{background:#f9fafb;font-size:12px;text-transform:uppercase;color:#6b7280}
 .Present{color:#15803d}.Late{color:#b45309}.HalfDay{color:#c2410c}.Absent{color:#b91c1c;font-weight:600}.Leave{color:#7c3aed}.Holiday,.WeekOff{color:#6b7280}
 .rejected{text-decoration:line-through;color:#9ca3af}
 .tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#e5e7eb}.tag.warn{background:#fef3c7;color:#92400e}.tag.bad{background:#fee2e2;color:#991b1b}.tag.good{background:#dcfce7;color:#166534}
 .toast{background:#dcfce7;border-left:4px solid #16a34a;padding:10px 14px;margin:6px 0;border-radius:4px}
 input,select,button{padding:6px 10px;margin:2px;font-size:14px} button{cursor:pointer}
 img.th{width:44px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer}
 .bar{margin-bottom:12px} .hint{color:#6b7280;font-size:13px;margin:6px 0}
 #big{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center} #big img{max-width:90%;max-height:90%;border-radius:8px}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
 .stat{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px #0001;cursor:pointer;border-left:5px solid var(--c)}
 .stat b{font-size:30px;display:block}.stat span{color:#6b7280;font-size:13px}
 .two{display:grid;grid-template-columns:3fr 2fr;gap:16px}@media(max-width:850px){.two{grid-template-columns:1fr}}
 .panel{background:#fff;border-radius:10px;box-shadow:0 1px 3px #0001;overflow:hidden;margin-bottom:16px}.panel h4{margin:0;padding:10px 14px;color:#fff;background:var(--c,#2563eb)}
 .bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:14px 14px 0;overflow-x:auto}.bars div{flex:0 1 90px;min-width:34px;text-align:center;font-size:11px}
 .bars i{display:block;background:#22c55e;border-radius:3px 3px 0 0;margin:0 auto;width:60%}.bars em{display:block;font-style:normal;height:16px}.bars u{text-decoration:none;display:block;height:30px;overflow:hidden}
 .gp{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid #f3f4f6;align-items:center}.gp img{width:44px;height:44px;border-radius:6px;object-fit:cover}
 .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#16a34a}.dot.off{background:#dc2626}
 table.sheet td,table.sheet th{padding:4px 5px;text-align:center;font-size:12px}table.sheet td:first-child,table.sheet th:first-child{text-align:left;position:sticky;left:0;background:#fff}
 .c-P{color:#15803d}.c-L{color:#b45309;font-weight:600}.c-HD{color:#c2410c;font-weight:600}.c-A{color:#b91c1c;font-weight:700}.c-LV{color:#7c3aed}.c-H,.c-WO{color:#9ca3af}
</style></head><body>
<header><b style="margin-right:8px">Attendance</b>
 <a data-t="live" class="on">Dashboard</a><a data-t="punches">Punches</a><a data-t="daily">Daily</a><a data-t="monthly">Monthly</a><a data-t="sheet">Sheet</a><a data-t="timecard">Time Card</a><a data-t="payroll">Payroll</a>
 <a data-t="emp">Employees</a><a data-t="shifts">Shifts</a><a data-t="holidays">Holidays</a><a data-t="leave">Leave</a><a data-t="devices">Devices</a><a data-t="import">Import</a><a data-t="sites">Sites</a><a data-t="users">Users</a><a data-t="audit">Audit</a>
 <span style="margin-left:auto;font-size:13px;color:#cbd5e1"><span id="who"></span> <a id="pw">Password</a> <a id="out">Log out</a></span> <span id="conn" style="margin-left:8px;font-size:12px">●</span></header>
<main id="m"></main><div id="big" onclick="this.style.display='none'"><img></div>
<script>
const $=s=>document.querySelector(s), m=$('#m'); let tab='live';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const j=async(u,o)=>{o=o||{};o.headers=Object.assign({'X-Requested-With':'fetch'},o.headers||{});const r=await fetch(u,o); if(r.status==401){location.href='/login';throw new Error('Please log in')} const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(typeof d.detail=='string'?d.detail:r.status); return d};
const post=(u,b)=>j(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const cls=v=>String(v||'').replace(/ /g,'');
// cols: [key,label,optional render fn returning trusted HTML]
const tbl=(cols,rows,extra='')=>`<table ${extra}><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c[0]=='status'?cls(r.status):''}">${c[2]?c[2](r):esc(r[c[0]])}</td>`).join('')}</tr>`).join('')}</table>`;
let devs=[], emps=[], shifts=[], listCache=[];
const devName=id=>{const d=devs.find(x=>x.dev_id==id);return d?(d.name||d.dev_id):id};
const devSel=()=>`<select id="dv"><option value="">All devices</option>${devs.map(d=>`<option value="${esc(d.dev_id)}">${esc(d.name||d.dev_id)}${d.location?' / '+esc(d.location):''}</option>`).join('')}<option value="app">Mobile app</option></select>`;
const dq=()=>{const v=$('#dv')?$('#dv').value:'';return v?'&device='+encodeURIComponent(v):''};
const empSel=(id)=>`<select id="${id}">${emps.filter(e=>e.active).map(e=>`<option value="${esc(e.device_user_id)}">${esc(e.name)} (${esc(e.device_user_id)})</option>`).join('')}</select>`;
const shiftSel=(id)=>`<select id="${id}"><option value="">No shift (flexible)</option>${shifts.map(s=>`<option value="${s.id}">${esc(s.name)} ${s.start}-${s.end}</option>`).join('')}</select>`;
const punchCols=[
 ['ts','Time',r=>`<span class="${r.flag=='rejected'?'rejected':''}">${esc(r.ts.slice(11))}</span>`],
 ['name','Name'],['device_user_id','ID'],
 ['method','Via',r=>`<span class="tag">${r.method=='app'?'App':r.method=='manual'?'Manual':esc(devName(r.source))}</span>`],
 ['site','Place',r=>r.method!='app'?'':`${esc(r.site||'—')}${r.distance_m!=null?' · '+Math.round(r.distance_m)+' m':''} ${r.lat!=null?`<a target="_blank" href="https://maps.google.com/?q=${r.lat},${r.lng}">map</a>`:''}`],
 ['selfie','Selfie',r=>r.selfie?`<img class="th" src="/api/selfies/${esc(r.selfie)}" onclick="big(this.src)">`:''],
 ['flag','Status',r=>r.flag=='outside_geofence'?'<span class="tag warn">outside area</span>':r.flag=='rejected'?'<span class="tag bad">rejected</span>':r.flag=='approved'?'<span class="tag good">approved</span>':''],
 ['id','',r=>r.method!='device'?(r.flag=='rejected'?`<button onclick="review(${r.id},'')">Restore</button>`:`<button onclick="review(${r.id},'rejected')">Reject</button>${r.flag=='outside_geofence'?`<button onclick="review(${r.id},'approved')">Approve</button>`:''}`):'']];
const mins=n=>n?`${Math.floor(n/60)}h ${n%60}m`:'';
function go(t){document.querySelector(`header a[data-t=${t}]`).click()}
function big(src){const b=$('#big');b.querySelector('img').src=src;b.style.display='flex'}
async function review(id,flag){await post(`/api/punches/${id}/review`,{flag});render()}
const safe=fn=>async(...a)=>{try{await fn(...a)}catch(e){alert(e.message)}};
async function render(){
 try{
 [devs,emps,shifts]=await Promise.all([j('/api/devices'),j('/api/employees'),j('/api/shifts')]);
 if(tab=='live'){
  const d=await j('/api/dashboard'); const mx=Math.max(1,...d.departments.map(x=>x.present));
  m.innerHTML=`<div id="feed"></div>
  <div class="grid">
   <div class="stat" style="--c:#16a34a" onclick="go('daily')"><span>Total Employees</span><b>${d.total}</b></div>
   <div class="stat" style="--c:#2563eb" onclick="go('daily')"><span>Total Present</span><b>${d.present}</b></div>
   <div class="stat" style="--c:#dc2626" onclick="go('daily')"><span>Total Absent</span><b>${d.absent}</b></div>
   <div class="stat" style="--c:#f59e0b" onclick="go('daily')"><span>Total Late</span><b>${d.late}</b></div></div>
  <div class="two"><div>
   <div class="panel"><h4>Department wise present</h4><div class="bars">${d.departments.map(x=>`<div><em>${x.present}</em><i style="height:${Math.round(x.present/mx*110)+4}px"></i><u>${esc(x.name)}</u></div>`).join('')||'<p class="hint">No data yet</p>'}</div></div>
   <div class="panel" style="--c:#f59e0b"><h4>Machine connection status</h4>${tbl([['n','S.N.',r=>r._i],['name','Machine',r=>esc(r.name||r.dev_id)],['location','Location'],['total_logs','Logs received'],['last_punch','Last punching time',r=>esc(r.last_punch||'—')],['online','Connected',r=>`<span class="dot ${r.online?'':'off'}"></span>`]],d.devices.map((x,i)=>({...x,_i:i+1})))}</div></div>
   <div class="panel" style="--c:#0891b2"><h4>GPS punches (today)</h4>${d.gps_punches.map(g=>`<div class="gp">${g.selfie?`<img src="/api/selfies/${esc(g.selfie)}" onclick="big(this.src)">`:''}<div><b>${esc(g.device_user_id)}: ${esc(g.name)}</b><div class="hint">${esc(g.ts.slice(11,16))} · ${esc(g.site||'outside sites')}${g.flag=='outside_geofence'?' ⚠':''} · <a target="_blank" href="https://maps.google.com/?q=${g.lat},${g.lng}">map</a></div></div></div>`).join('')||'<p class="hint" style="padding:14px">No app punches today</p>'}</div></div>`;
 } else if(tab=='punches'){
  m.innerHTML=`<div class="bar"><input type="date" id="d" value="${today()}"> ${devSel()}</div>
   <div class="bar"><b>Manual punch:</b> ${empSel('mp_e')} <input type="datetime-local" id="mp_t" value="${today()}T09:00"><button id="mp_b">Add</button> <span class="hint">for corrections, e.g. a forgotten scan</span></div><div id="t"></div>`;
  const load=async()=>$('#t').innerHTML=tbl(punchCols,await j('/api/punches?day='+$('#d').value+dq()));
  $('#d').onchange=load; $('#dv').onchange=load;
  $('#mp_b').onclick=safe(async()=>{const r=await post('/api/punches',{device_user_id:$('#mp_e').value,ts:$('#mp_t').value.replace('T',' ')+':00'});if(!r.stored)alert('Not saved: a punch within a minute of that time already exists');load()}); load();
 } else if(tab=='daily'){
  m.innerHTML=`<div class="bar"><input type="date" id="d" value="${today()}"> ${devSel()} <select id="f"><option value="">All employees</option><option>Present</option><option>Late</option><option>Half Day</option><option>Absent</option><option>Leave</option><option value="early">Early going</option><option value="miss">Miss punch</option><option value="dept">Department summary</option></select> <a href="#" id="csv">CSV</a> <a href="#" id="xlsx">Excel</a></div><div id="t"></div>`;
  const load=async()=>{let r=await j('/api/reports/daily?day='+$('#d').value+dq()); const f=$('#f').value;
   if(f=='dept'){const g={};r.forEach(x=>{const k=x.department||'Unassigned';const o=g[k]||(g[k]={department:k,total:0,present:0,late:0,absent:0,leave:0,weekoff:0});o.total++;if(['Present','Late','Half Day'].includes(x.status))o.present++;if(x.status=='Late')o.late++;if(x.status=='Absent')o.absent++;if(x.status=='Leave')o.leave++;if(x.status=='Weekly Off'||x.status=='Holiday')o.weekoff++});
    const rows=Object.values(g).sort((a,b)=>a.department.localeCompare(b.department));const tt=rows.reduce((a,x)=>{for(const k of ['total','present','late','absent','leave','weekoff'])a[k]+=x[k];return a},{department:'TOTAL',total:0,present:0,late:0,absent:0,leave:0,weekoff:0});
    $('#t').innerHTML=tbl([['department','Department'],['total','Employees'],['present','Present'],['late','Late'],['absent','Absent'],['leave','Leave'],['weekoff','Off / Holiday']],rows.concat([tt]));return}
   if(f=='early')r=r.filter(x=>x.early_min>0); else if(f=='miss')r=r.filter(x=>(x.note||'').includes('missing out')); else if(f)r=r.filter(x=>x.status==f);
   $('#t').innerHTML=tbl([['name','Name'],['department','Dept'],['shift','Shift'],['first_in','In'],['last_out','Out'],['hours','Hours'],['late_min','Late',r=>mins(r.late_min)],['early_min','Early out',r=>mins(r.early_min)],['ot_min','Overtime',r=>mins(r.ot_min)],['status','Status'],['note','Note']],r)};
  $('#d').onchange=load; $('#dv').onchange=load; $('#f').onchange=load; $('#csv').onclick=e=>{e.target.href='/api/reports/daily.csv?day='+$('#d').value+dq()}; $('#xlsx').onclick=e=>{e.target.href='/api/reports/daily.xlsx?day='+$('#d').value+dq()}; load();
 } else if(tab=='monthly'){
  m.innerHTML=`<div class="bar"><input type="month" id="mo" value="${today().slice(0,7)}"> ${devSel()} <a href="#" id="csv">CSV</a> <a href="#" id="xlsx">Excel</a></div><div id="t"></div>`;
  const load=async()=>$('#t').innerHTML=tbl([['name','Name'],['department','Dept'],['shift','Shift'],['days_present','Present'],['late_days','Late days'],['half_days','Half'],['absent','Absent'],['leave','Leave'],['holidays','Hol.'],['weekly_offs','W.off'],['total_hours','Hours'],['overtime_hours','OT hrs'],['late_minutes','Late min'],['paid_days','Paid days']],await j('/api/reports/monthly?month='+$('#mo').value+dq()));
  $('#mo').onchange=load; $('#dv').onchange=load; $('#csv').onclick=e=>{e.target.href='/api/reports/monthly.csv?month='+$('#mo').value+dq()}; $('#xlsx').onclick=e=>{e.target.href='/api/reports/monthly.xlsx?month='+$('#mo').value+dq()}; load();
 } else if(tab=='sheet'){
  m.innerHTML=`<div class="bar"><input type="month" id="mo" value="${today().slice(0,7)}"> ${devSel()} <a href="#" id="csv">CSV</a> <a href="#" id="xlsx">Excel</a> <a href="#" id="mus">Muster roll (Excel)</a> <span class="hint">P present · L late · HD half day · A absent · LV leave · H holiday · WO weekly off</span></div><div id="t"></div>`;
  const load=async()=>{const g=await j('/api/reports/grid?month='+$('#mo').value+dq());
   $('#t').innerHTML=`<table class="sheet"><tr><th>Employee</th>${g.days.map(d=>`<th>${d}</th>`).join('')}<th>Worked</th><th>W.off</th><th>Hol.</th><th>Leave</th><th>Absent</th><th>Paid</th></tr>${g.rows.map(r=>`<tr><td>${esc(r.name)}</td>${r.codes.map(c=>`<td class="c-${c}">${c}</td>`).join('')}${['worked','weekly_offs','holidays','leave','absent','paid_days'].map(k=>`<td><b>${r.totals[k]}</b></td>`).join('')}</tr>`).join('')}</table>`};
  $('#mo').onchange=load; $('#dv').onchange=load; $('#csv').onclick=e=>{e.target.href='/api/reports/grid.csv?month='+$('#mo').value+dq()}; $('#xlsx').onclick=e=>{e.target.href='/api/reports/grid.xlsx?month='+$('#mo').value+dq()}; $('#mus').onclick=e=>{e.target.href='/api/reports/muster.xlsx?month='+$('#mo').value+dq()}; load();
 } else if(tab=='timecard'){
  m.innerHTML=`<div class="bar">${empSel('tce')} <input type="month" id="mo" value="${today().slice(0,7)}"> <a href="#" id="xlsx">Excel</a></div><div id="t"></div>`;
  const load=async()=>$('#t').innerHTML=tbl([['date','Date'],['weekday','Day'],['day_type','Day type'],['schedule','Schedule'],['in','In',r=>esc(r.in)],['out','Out',r=>esc(r.out)],['hours','Hours'],['late_min','Late',r=>mins(r.late_min)],['early_min','Early out',r=>mins(r.early_min)],['overtime_min','Overtime',r=>mins(r.overtime_min)],['status','Status'],['note','Note']],await j('/api/reports/timecard?employee='+encodeURIComponent($('#tce').value)+'&month='+$('#mo').value));
  $('#tce').onchange=load; $('#mo').onchange=load; $('#xlsx').onclick=e=>{e.target.href='/api/reports/timecard.xlsx?employee='+encodeURIComponent($('#tce').value)+'&month='+$('#mo').value}; if($('#tce').value)load();
 } else if(tab=='payroll'){
  m.innerHTML=`<div class="bar"><input type="month" id="mo" value="${today().slice(0,7)}"> <a href="#" id="csv">CSV</a> <a href="#" id="xlsx">Excel</a></div>
   <p class="hint">Pay = monthly salary ÷ days in month × paid days (present, paid leave, holidays and weekly offs; half day = 0.5). No tax, PF/ESI or allowances. Run it after the month ends; set salaries in Employees.</p><div id="t"></div>`;
  const load=async()=>{const r=await j('/api/reports/payroll?month='+$('#mo').value); const tot=r.reduce((a,x)=>a+x.net_pay,0);
   $('#t').innerHTML=tbl([['name','Name'],['department','Dept'],['monthly_salary','Monthly salary'],['days_in_month','Days'],['paid_days','Paid days'],['unpaid_days','Unpaid days'],['net_pay','Net pay']],r)+`<p><b>Total net pay: ${tot.toFixed(2)}</b>${r.length&&!r[0].month_complete?' <span class="tag warn">month not finished: days still to come are not counted</span>':''}</p>`};
  $('#mo').onchange=load; $('#csv').onclick=e=>{e.target.href='/api/reports/payroll.csv?month='+$('#mo').value}; $('#xlsx').onclick=e=>{e.target.href='/api/reports/payroll.xlsx?month='+$('#mo').value}; load();
 } else if(tab=='shifts'){
  m.innerHTML=`<div class="bar"><input type="hidden" id="sid"><input id="sn" placeholder="Shift name"> start <input type="time" id="ss" value="09:00"> end <input type="time" id="se" value="18:00"> grace min <input id="sg" size=3 value="10"> half-day below (hrs) <input id="sh" size=3 value="4"> overtime after (min) <input id="so" size=3 value="30"> weekly off <input id="sw" size=10 value="SUN" placeholder="SUN or SAT,SUN"> <button id="s">Save shift</button></div>
   <p class="hint">Create a shift for each timing you use, then assign it to each employee in Employees. Employees without a shift are "flexible": never late, no overtime. Overnight shifts are not supported yet.</p><div id="t"></div>`;
  listCache=shifts;
  $('#t').innerHTML=tbl([['name','Name'],['start','Start'],['end','End'],['grace_min','Grace'],['half_day_hours','Half-day hrs'],['ot_after_min','OT after'],['weekly_off','Weekly off'],['employees','Employees'],['x','',r=>`<button onclick="editShift(${listCache.indexOf(r)})">Edit</button><button onclick="delShift(${r.id})">Delete</button>`]],shifts.map(s=>s));
  $('#s').onclick=safe(async()=>{await post('/api/shifts',{id:$('#sid').value?+$('#sid').value:null,name:$('#sn').value,start:$('#ss').value,end:$('#se').value,grace_min:+$('#sg').value,half_day_hours:+$('#sh').value,ot_after_min:+$('#so').value,weekly_off:$('#sw').value});render()});
 } else if(tab=='holidays'){
  m.innerHTML=`<div class="bar"><input type="number" id="y" value="${today().slice(0,4)}" style="width:80px"> <input type="date" id="hd"><input id="hn" placeholder="Holiday name"><button id="s">Add</button></div><div id="t"></div>`;
  const load=async()=>{const h=await j('/api/holidays?year='+$('#y').value);listCache=h;$('#t').innerHTML=tbl([['date','Date'],['name','Name'],['x','',r=>`<button onclick="delHoliday(${listCache.indexOf(r)})">Delete</button>`]],h)};
  $('#y').onchange=load; $('#s').onclick=safe(async()=>{await post('/api/holidays',{date:$('#hd').value,name:$('#hn').value});load()}); load();
 } else if(tab=='leave'){
  m.innerHTML=`<div class="bar">${empSel('le')} from <input type="date" id="lf" value="${today()}"> to <input type="date" id="lt" value="${today()}"> <select id="ly"><option>Casual</option><option>Sick</option><option>Paid</option><option>Unpaid</option><option>Other</option></select><input id="ln" placeholder="Note"><button id="s">Add leave</button></div>
   <div class="bar"><input type="month" id="mo" value="${today().slice(0,7)}"> <span class="hint">Unpaid leave is not paid in Payroll; all other types are.</span></div><div id="t"></div>`;
  const load=async()=>{const l=await j('/api/leaves?month='+$('#mo').value);listCache=l;$('#t').innerHTML=tbl([['name','Employee'],['start_date','From'],['end_date','To'],['type','Type'],['note','Note'],['x','',r=>`<button onclick="delLeave(${listCache.indexOf(r)})">Delete</button>`]],l)};
  $('#mo').onchange=load; $('#s').onclick=safe(async()=>{await post('/api/leaves',{device_user_id:$('#le').value,start_date:$('#lf').value,end_date:$('#lt').value,type:$('#ly').value,note:$('#ln').value});load()}); load();
 } else if(tab=='import'){
  m.innerHTML=`<p class="hint">Load data exported from another system (Excel .xlsx or .csv). Column names are matched automatically (for example "Emp Code", "Card No" and "ID" all work). Recommended order: <b>Shifts → Employees → Holidays → Leave → Punches</b>. Preview first: nothing is saved until you untick "Preview only".</p>
   <div class="bar"><select id="ik"><option value="shifts">Shifts</option><option value="employees">Employees</option><option value="holidays">Holidays</option><option value="leaves">Leave</option><option value="punches">Punches (attendance history)</option></select>
   <input type="file" id="if" accept=".csv,.xlsx,.txt"> <label><input type="checkbox" id="idry" checked> Preview only</label> <button id="ib">Run</button> <a href="#" id="itpl">Download template</a></div><div id="t"></div>`;
  $('#itpl').onclick=e=>{e.target.href='/api/import/'+$('#ik').value+'/template.csv'};
  $('#ib').onclick=safe(async()=>{const f=$('#if').files[0]; if(!f){alert('Choose a file first');return}
   const dry=$('#idry').checked; if(!dry&&!confirm('Import for real? This writes to the database.'))return;
   const fd=new FormData(); fd.append('file',f); $('#ib').disabled=true;
   try{const r=await j(`/api/import/${$('#ik').value}?dry_run=${dry}`,{method:'POST',body:fd});
    $('#t').innerHTML=`<div class="toast">${dry?'<b>Preview (nothing saved):</b> ':'<b>Imported:</b> '}${r.rows} rows read · ${r.created} new · ${r.updated} updated · ${r.skipped} skipped${r.errors.length?' · '+r.errors.length+' problems':''}</div>`+(r.errors.length?tbl([['row','Row in file'],['message','Problem']],r.errors):'')+(dry&&!r.errors.length?'<p class="hint">Looks good. Untick "Preview only" and press Run to import.</p>':'');
   }finally{$('#ib').disabled=false}});
 } else if(tab=='users'){
  m.innerHTML=`<div class="bar"><input id="un" placeholder="Username" size=12><input id="ud" placeholder="Display name" size=14><input id="up" type="password" placeholder="Password (min 8)" size=14> <select id="ur"><option value="manager">Team Lead (read-only, one department)</option><option value="management">Management (read-only, all departments)</option><option value="hr">HR (day-to-day work and payroll)</option><option value="admin">Admin (everything)</option></select><input id="ut" placeholder="Department (managers)" size=14><label><input type="checkbox" id="ua" checked> Active</label><button id="s">Save user</button></div>
   <p class="hint">Team leads see only their department. Team leads and management are read-only and never see salaries. To change someone's password, enter a new one and save. Leave it empty to keep the current password.</p><div id="t"></div>`;
  const us=await j('/api/users'); listCache=us;
  $('#t').innerHTML=tbl([['username','Username'],['display_name','Name'],['role','Role'],['department','Department'],['active','Active'],['x','',r=>`<button onclick="editUser(${listCache.indexOf(r)})">Edit</button><button onclick="delUser(${listCache.indexOf(r)})">Delete</button>`]],us);
  $('#s').onclick=safe(async()=>{await post('/api/users',{username:$('#un').value,display_name:$('#ud').value,password:$('#up').value,role:$('#ur').value,department:$('#ut').value,active:$('#ua').checked});render()});
 } else if(tab=='audit'){
  m.innerHTML=`<p class="hint">Every change made through the admin site, newest first (who, what, result). Request contents such as passwords are never logged.</p><div id="t"></div>`;
  $('#t').innerHTML=tbl([['ts','Time'],['user','User'],['action','Action'],['status','Result']],await j('/api/audit'));
 } else if(tab=='devices'){
  m.innerHTML=`<p class="hint">Devices appear here automatically the first time they contact the server. Online = heard from in the last 90 seconds.</p><div id="t"></div>`;
  listCache=devs;
  $('#t').innerHTML=tbl([['name','Name',r=>esc(r.name||r.dev_id)],['location','Location'],['dev_id','Device ID'],['model','Model',r=>esc(r.model)+(r.firmware?' <span class="hint">'+esc(r.firmware)+'</span>':'')],['online','Status',r=>r.online?'<span class="tag good">Online</span>':'<span class="tag bad">Offline</span>'],['last_seen','Last seen'],['x','',r=>`<button onclick="renameDev(${listCache.indexOf(r)})">Edit</button>`]],devs);
 } else if(tab=='emp'){
  m.innerHTML=`<div class="bar"><input id="i" placeholder="Employee / device ID" size=14><input id="n" placeholder="Name"><input id="dp" placeholder="Department" size=12> ${shiftSel('es')} <input id="sal" placeholder="Monthly salary" size=10 type="number"> joined <input type="date" id="jd"><button id="s">Save</button></div>
   <p class="hint">Use the same ID that is enrolled on the fingerprint device. Assign each person a shift, and set a joining date for anyone who joined this month (days before it are not counted). Set a PIN so the person can use the phone app.</p><div id="t"></div>`;
  listCache=emps;
  $('#t').innerHTML=tbl([['device_user_id','ID'],['name','Name'],['department','Dept'],['shift','Shift'],['salary','Salary'],['joined','Joined'],['active','Active'],
    ['pin','App PIN',r=>`<button onclick="setPin(${listCache.indexOf(r)})">${r.pin_hash?'Change':'Set'} PIN</button>`],
    ['x','',r=>`<button onclick="editEmp(${listCache.indexOf(r)})">Edit</button>`]],emps);
  $('#s').onclick=safe(async()=>{await post('/api/employees',{device_user_id:$('#i').value,name:$('#n').value,department:$('#dp').value,shift_id:$('#es').value?+$('#es').value:null,salary:+($('#sal').value||0),joined:$('#jd').value});render()});
 } else {
  m.innerHTML=`<div class="bar"><input id="sn" placeholder="Site name"><input id="la" placeholder="Latitude" size=10><input id="lo" placeholder="Longitude" size=10><input id="ra" placeholder="Radius (m)" value="150" size=6><button id="gps">Use my location</button><button id="s">Add site</button></div>
   <p class="hint">App punches must be within the radius of a site. With no sites, locations are recorded but never blocked. Tip: stand at the office, open this page on your phone and tap "Use my location".</p><div id="t"></div>`;
  const load=async()=>{const st=await j('/api/sites');listCache=st;$('#t').innerHTML=tbl([['name','Name'],['lat','Latitude'],['lng','Longitude'],['radius_m','Radius (m)'],['id','',r=>`<button onclick="delSite(${r.id})">Remove</button>`]],st)};
  $('#gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{$('#la').value=p.coords.latitude.toFixed(6);$('#lo').value=p.coords.longitude.toFixed(6)},e=>alert('Location unavailable: '+e.message));
  $('#s').onclick=safe(async()=>{await post('/api/sites',{name:$('#sn').value,lat:+$('#la').value,lng:+$('#lo').value,radius_m:+$('#ra').value});load()}); load();
 }
 }catch(e){m.innerHTML=`<p class="Absent">Error: ${esc(e.message)}</p>`}
}
// row actions use list indexes (never put text in inline handlers)
function editUser(i){const u=listCache[i];$('#un').value=u.username;$('#ud').value=u.display_name;$('#up').value='';$('#ur').value=u.role;$('#ut').value=u.department;$('#ua').checked=!!u.active}
const delUser=safe(async i=>{if(confirm('Delete user '+listCache[i].username+'?')){await j('/api/users/'+encodeURIComponent(listCache[i].username),{method:'DELETE'});render()}});
function editEmp(i){const e=listCache[i];$('#i').value=e.device_user_id;$('#n').value=e.name;$('#dp').value=e.department;$('#es').value=e.shift_id??'';$('#sal').value=e.salary||'';$('#jd').value=e.joined||''}
function editShift(i){const s=listCache[i];$('#sid').value=s.id;$('#sn').value=s.name;$('#ss').value=s.start;$('#se').value=s.end;$('#sg').value=s.grace_min;$('#sh').value=s.half_day_hours;$('#so').value=s.ot_after_min;$('#sw').value=s.weekly_off}
const delShift=safe(async id=>{if(confirm('Delete this shift? Its employees become flexible.')){await j('/api/shifts/'+id,{method:'DELETE'});render()}});
const delHoliday=safe(async i=>{if(confirm('Delete this holiday?')){await j('/api/holidays/'+listCache[i].date,{method:'DELETE'});render()}});
const delLeave=safe(async i=>{if(confirm('Delete this leave?')){await j('/api/leaves/'+listCache[i].id,{method:'DELETE'});render()}});
const delSite=safe(async id=>{if(confirm('Remove this site?')){await j('/api/sites/'+id,{method:'DELETE'});render()}});
const setPin=safe(async i=>{const e=listCache[i];const p=prompt('New PIN for '+e.name+' (4-8 digits):');if(!p)return;await post(`/api/employees/${encodeURIComponent(e.device_user_id)}/pin`,{pin:p});alert('PIN saved');render()});
const renameDev=safe(async i=>{const d=listCache[i];const name=prompt('Device name (e.g. Mumbai Office):',d.name);if(name===null)return;const loc=prompt('Location:',d.location);if(loc===null)return;await post(`/api/devices/${encodeURIComponent(d.dev_id)}/info`,{name,location:loc});render()});
document.querySelectorAll('header a').forEach(a=>a.onclick=()=>{document.querySelectorAll('header a').forEach(x=>x.classList.remove('on'));a.classList.add('on');tab=a.dataset.t;render()});
function connect(){
 const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onopen=()=>{$('#conn').style.color='#4ade80';ws.send('hi')}; ws.onclose=()=>{$('#conn').style.color='#f87171';setTimeout(connect,2000)};
 ws.onmessage=e=>{const p=JSON.parse(e.data); if(tab!='live')return; const d=document.createElement('div');d.className='toast';d.textContent=`${p.ts.slice(11)}  ${p.name} checked in${p.flag=='outside_geofence'?' (outside area)':''}`;$('#feed').prepend(d);setTimeout(render,500)};
}
const HIDE={manager:['payroll','emp','shifts','holidays','leave','import','sites','users','audit'],management:['payroll','emp','shifts','holidays','leave','import','sites','users','audit'],hr:['sites','users','audit'],admin:[]};
(async()=>{try{const me=await j('/api/auth/me');
  $('#who').textContent=me.open_mode?'OPEN MODE (no login)':`${me.display_name||me.username} · ${me.role}${me.role=='manager'?' · '+me.department:''}`;
  (HIDE[me.role]||[]).forEach(t=>{const a=document.querySelector(`header a[data-t=${t}]`);if(a)a.style.display='none'});
  if(me.open_mode){$('#out').style.display=$('#pw').style.display='none'}
  $('#out').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',headers:{'X-Requested-With':'fetch'}});location.href='/login'};
  $('#pw').onclick=safe(async()=>{const o=prompt('Current password:');if(!o)return;const n=prompt('New password (min 8 characters):');if(!n)return;await post('/api/auth/password',{old_password:o,new_password:n});alert('Password changed')});
  if(me.role=='hr'||me.role=='admin')connect();
  render();
 }catch(e){}})();
</script></body></html>
